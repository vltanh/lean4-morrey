name = "Morrey"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Common", "Pedregal", "Sverak", "Cassese", "HomogeneousIsotropic", "Palomar"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc2"

[[require]]
name = "FixedPoint"
git = "https://github.com/vltanh/lean4-fixed-point.git"
rev = "5f650f00b1db63837a452696331a98ca886b94a8"

[[require]]
name = "HarmonicAnalysis"
git = "https://github.com/vltanh/lean4-harmonic-analysis"
rev = "495bafe368b7296a24c05dd568fae5bc281bca21"

[[require]]
name = "CalculusOfVariations"
git = "https://github.com/vltanh/lean4-calculus-of-variations"
rev = "220f56c2e6a70679458409fac49def1f9af1c7b5"

[[require]]
name = "BanachProbability"
git = "https://github.com/vltanh/lean4-banach-probability"
rev = "dc3966ce34fbc31b2936a0ca9b8a50356d690ae1"

# The formalization of Agazzi et al., arXiv:2609.28311: the quasiconvexity of the truncated
# determinant, for Morrey/HomogeneousIsotropic. It requires the three packages above at these pins.
[[require]]
name = "Iwaniec"
git = "https://github.com/vltanh/lean4-iwaniec"
rev = "54cf298b0c4da3ba12a8e58f320f04937e7df1ec"

[[lean_lib]]
name = "Common"
globs = ["Morrey.Common.+"]

[[lean_lib]]
name = "Pedregal"
globs = ["Morrey.Pedregal.+"]

[[lean_lib]]
name = "Sverak"
globs = ["Morrey.Sverak.+"]

[[lean_lib]]
name = "Cassese"
globs = ["Morrey.Cassese.+"]

[[lean_lib]]
name = "HomogeneousIsotropic"
globs = ["Morrey.HomogeneousIsotropic.+"]

# Each paper's Challenge and Solution (the files of its Palomar submission), as the modules
# `Pedregal.Challenge`, `Pedregal.Solution`, ... of the source directory `palomar/`.
[[lean_lib]]
name = "Palomar"
srcDir = "palomar"
globs = ["Pedregal.+", "Sverak.+", "Cassese.+", "HomogeneousIsotropic.+"]
