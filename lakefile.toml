name = "Morrey"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Common", "Pedregal", "Sverak", "Cassese", "Palomar"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc2"

[[require]]
name = "FixedPoint"
git = "https://github.com/vltanh/lean4-fixed-point.git"
rev = "5f650f00b1db63837a452696331a98ca886b94a8"

# Developed alongside the project; to be pinned by `git` and `rev` once it is published.
[[require]]
name = "HarmonicAnalysis"
path = "../lean4-harmonic-analysis"

[[lean_lib]]
name = "Common"
globs = ["Morrey.Common.+"]

[[lean_lib]]
name = "Pedregal"
globs = ["Morrey.Pedregal.+"]

[[lean_lib]]
name = "Sverak"
globs = ["Morrey.Sverak.+"]

[[lean_lib]]
name = "Cassese"
globs = ["Morrey.Cassese.+"]

# Each paper's Challenge and Solution (the files of its Palomar submission), as the modules
# `Pedregal.Challenge`, `Pedregal.Solution`, ... of the source directory `palomar/`.
[[lean_lib]]
name = "Palomar"
srcDir = "palomar"
globs = ["Pedregal.+", "Sverak.+", "Cassese.+"]
