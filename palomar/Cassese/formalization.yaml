    note: >-
      Written for this project by the same AI system: Fourier multipliers and duality, transference
      from the torus to the plane, Poisson summation, Dragičević's lower bound for the square of the
      Beurling-Ahlfors transform, smooth periodic Fourier series. Published; lakefile.toml requires
      it from GitHub at a pinned commit.
  - id: "https://github.com/vltanh/lean4-banach-probability"
    relationship: "builds-on"
    note: >-
      Written for this project by the same AI system: Burkholder's inequality, its sharpness and
      Burkholder's function, UMD theory (dyadic and complex constants, decoupling, extrapolation, L^p,
      zig-zag concavity), Kahane-Khintchine and hypercontractivity, Schatten classes, the
      non-commutative Khintchine inequality, Randrianantoanina's non-commutative martingale
      transforms. Published; lakefile.toml requires it from GitHub at a pinned commit.
  - id: "https://github.com/vltanh/lean4-calculus-of-variations"
    relationship: "builds-on"
    note: >-
      Written for this project by the same AI system: rank-one convexity and quasiconvexity,
      Dacorogna's formula, minors and null Lagrangians, quadratic forms, Kristensen's smoothing,
      distributional second derivatives on R. Published; lakefile.toml requires it from GitHub at a
      pinned commit.
  - id: "https://github.com/Gabriele-Cassese/MorreyTwoComponentsLean"
    relationship: "independent"
    note: >-
      The author's own Lean formalization of Theorem 1.2 and of Theorem 1.3 at p = 4, made with an
      AI system and released without a license. The proofs here were written without consulting it, and
      nothing from it was used; searches and checks of 21-22 November 2026 displayed parts of it (README,
      first lines of declarations, some statements, about 180 lines of one file: docs/Cassese/CREDITS.md).
      This formalization covers the whole paper (Theorems 1.4, 1.5, Corollaries 1.6, 5.2-5.4, Sections 6
      and 7) and the cited results that its proofs use.
  - id: "https://github.com/sergioconti/so3-r1c-and-not-qc"
    relationship: "independent"
    note: >-
      Conti, Dolzmann and Dondl's Lean formalization of a 3 x 3 example; not a formalization of this
      paper. The proofs here were written without consulting it, and nothing from it was used; searches
      and checks of 21-22 November 2026 displayed parts of it (docs/Cassese/CREDITS.md).
  - id: "palomar/Sverak in this repository"
    relationship: "other"
    note: "The formalization of Šverák (1992), imported by this library (Šverák's example, the consequences after Theorem 1.3)."
  - id: "palomar/Pedregal in this repository"
    relationship: "other"
    note: "The audit of Pedregal's claimed proof for 2 x 2, in the same repository."

status:
  scope: >-
    Complete and unconditional. Proved: Theorems 1.2-1.5, Corollary 1.6, every lemma, proposition
    and corollary of Sections 2 and 4-7 except Proposition 2.6, Remark 6.3, (10), (13), (14), (31),
    and the claims of the running text that the proofs use, among them the consequences after
    Theorem 1.3 (only 2 x 2 is left; at p = 4 the homogeneous problem fails in every size above
    2 x 2). Theorem 1.2 is proved by the paper's route and, a second time, by the route of
    Remark 4.5. The results of other works that the proofs use are
    proved in Morrey/Common/External from three packages; no statement takes them as hypotheses.
    Stated and not proved, used by no proof: Kirchheim-Kristensen's Theorem 1.1 and Osękowski's
    Proposition 2.6, quoted by the paper as context, and Conjecture 1. Not formalized: remarks and
    claims that the paper asserts without proof (Corollary 1.6 for p > 2, Remarks 2.2, 5.2-5.4,
    7.2, the claims of lines 2521-2549), and interpretations that combine the paper with other
    work (docs/Cassese/REPORT.md, Section 9).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5", "claude-haiku-5-5"]
      framework: "Claude Code 2.1.330 (VS Code extension, Claude Agent SDK)"
      tool_setup: >-
        The formalize-math-paper skill (https://github.com/vltanh/formalize-math-paper): commit
        020f253 in the second round of the session, with its multi-paper reference written during
        that round (commits d385092 and b04ce21); version 4.2.0 (commit f5e7420), written during
        the third round; versions 4.2.1 to 4.3.1 (commits 8d291b1 to f9198d5) in the fourth. Second
        round: the main session and 28 sub-agents on this paper (an
        inventory, a statement writer, 2 statement reviewers and a fixer, 12 provers, an
        integrator, a cleanup agent, 3 proof reviewers and 4 fixers, a web reader, a report
        checker). Third round, which proved the cited results and redid the departures: the main
        session and 103 sub-agents (29 launched by the main session, the others by lead agents),
        among them scoping agents, a departure audit, the writers and provers of three Lake
        packages, integration agents and independent reviewers. Fourth round, which redid the cited
        results by their sources' proofs: 27 sub-agents (8 for the comparison with the sources, 4
        leads and 6 provers, 5 reviewers, an integrator and its 3 reviewers), besides the agents that
        updated and checked the documents. Lean v4.36.0-rc2, Mathlib v4.36.0-rc2.
      cost:
        wall_time: >-
          Second round: 8.3 h elapsed (this paper, Šverák's and the reorganization of the
          repository, in parallel), about 21 h of sub-agent working time on this paper. Third
          round: 6.8 h elapsed to the last commit of the proofs, 37.3 h of sub-agent working
          time (the whole session in that window, which also includes follow-up notes, a step of
          Šverák's Lemma 1 and the revision of the procedure). Fourth round: 2.95 h elapsed to the
          last commit of the proofs, 9.3 h of sub-agent working time on it (17.4 h for the whole
          session in that window).
        spend_usd: "not tracked"
        hardware: "local machine (20 cores, 62 GB RAM) and API"
      prompting_notes: >-
        The user asked for the paper to be formalized in the repository that held the audit of
        Pedregal's paper, independently of the author's Lean code, and chose to build every cited
        result that is large but feasible ("All"); then asked for every result to be proved
        unconditionally ("I think you need to formalize all of them unconditionally"), and let the
        agent decide without asking; then obtained the cited books and articles that the agent could
        not, so that the cited results could follow them.
  spend_usd: "not tracked"
  notes: >-
    The AI system wrote the code, the three packages and the documents at the request of the
    author. No person has reviewed the proofs. Independent AI agents checked the statements
    against the TeX source, compared the formal proofs with the paper's and the cited results with
    their sources, reviewed the packages' statements and the changed statements, audited the
    departures, and checked the report and the other documents. See docs/Cassese/CREDITS.md.

fidelity:
  divergences: >-
    Statements: no statement of the paper was changed. Readings: Definition 2.1 with Lipschitz
    test maps vanishing outside the open cube and the requirement that the integral exist
    (automatic for integrands); "integrand" = lower semicontinuous and locally bounded;
    prelaminates with repeated atoms (E10); Rademacher martingales on the canonical sign space;
    thresholds in [0, infinity]; UMD constants over every probability space in Type, every
    filtration and every predictable sequence of signs; operator norms of powers of the
    Beurling-Ahlfors transform as suprema over Schwartz functions on R^2, over mean-zero
    trigonometric polynomials on the torus, and, in Proposition 7.2, over smooth mean-zero
    tuples; Hessian quasiconvexity (undefined in the paper) with smooth compactly supported test
    maps; Theorem 1.3 (b) as "there is eps > 0 with |p - 4| < eps"; Corollaries 5.3, 5.4 with
    Lambda = K/delta; Proposition 6.5 at q = infinity with one alpha for every p; Theorem 1.4 with
    Schatten exponent q = 4. Generalizations: the identity of Proposition 7.2 for every real rho
    (its lower bound keeps rho > 0, which its proof uses); Lemma 2.1 for every real-valued
    rank-one convex function (E21); Dacorogna's Theorem 5.20, (ii) => (iii'), without continuity, as
    the book states it. Proposition 2.7 (6) is stated, as in the paper, with the equivalence also for
    complex spaces (the functions concave for multipliers in the closed unit disc, and UMD_p that of
    the underlying real space).
    Departures from the paper's proofs, each a repair of a gap or a false step: Theorem 1.3 (b)
    with explicit constants uniform in p (E4); Proposition 2.5 "<=" by Proposition 2.4's argument
    run on martingales (E10); Proposition 5.1's skipped step supplied (E9). Every other proof
    follows the paper's; the gaps it fills along the paper's own lines are findings of the audit
    (docs/Cassese/REPORT.md, Section 3), among them the passage from smooth to Lipschitz periodic
    test maps by mollification in Proposition 7.2 and Corollary 1.6 (E28, E35). Cited results: each
    by its source's argument, with one departure: the upper bound of the non-commutative Khintchine
    inequality (Proposition 6.3), whose cited sources prove it by the factorization of
    matrix-valued H^1 functions and duality (Lust-Piquard 1986, not obtained; Lust-Piquard-Pisier
    1991; Pisier-Xu 2003 give no proof), is proved at present by the method of exchangeable pairs of
    Mackey et al. (2014); it was proved before the 1991 article was obtained, and a proof by the
    sources' argument is planned. Read in another edition: Rindler 2018 (the second edition),
    Pisier 2016 (the 2011 lecture notes). Not obtained, and not needed: Heinz 2008, Pedregal 1993,
    Vasyunin-Volberg 2010. The triangle inequality of Schatten norms, which the paper uses without a
    source, is proved after Bourin-Zhang (2026), for real m x n matrices. Differences from the sources,
    each a repair of a gap or a slip along the source's lines, a step that the source leaves out, or
    a case of its statement: Kristensen's cut-offs as functions of |X|^2 (his xi_s exists only for
    s < 3) and an added constant; Randrianantoanina's projections read in the reduced algebra, his
    interpolation step done in three ranges of exponents, his Lemma 3.2 in a counting form;
    Dacorogna's Lemma 5.24, Part 2, with the columns restricted first; the local boundedness of
    rank-one convex functions, part of Rindler's definition, proved; Dacorogna's formula itself from
    Kinderlehrer-Pedregal's Proposition 8.1; HNVW's UMD theorems for the paper's predictable signs, for
    real spaces and probability spaces, Theorem 4.2.5 by the book's alternative proof (p. 334), and
    steps of Lemma 3.5.14, Theorem 4.5.6 and Proposition 5.7.4 repaired; Osękowski's two integral
    formulas proved, his majorization completed by Burkholder's (1.11), and his second approach
    run on the dyadic function of his Theorem 3.34; Burkholder's Remark 1.2 (1988), stated without
    proof, completed from his (1.14) and the shift of the proof of (1.8); Dragičević's sentence on
    W^{n,p}, stated without proof, replaced by a density argument; Pisier's Fubini argument on
    Paley-Walsh martingales; Mackey et al.'s Remark 7.2 for 2 < q < 3, whose unproved variant of the
    mean value trace inequality is proved. See docs/Cassese/REPORT.md, Section 7.

review:
  status: "agent-reviewed"
  reviewers:
    - "none"
  notes: >-
    No human review. Independent AI agents (Claude Opus 5.5) checked every statement against the
    TeX source (two reviewers), compared the formal proofs with the paper's (three reviewers), and
    checked the first version of the report against the sources; in the round that proved the
    cited results, they reviewed the packages' statements, the changed statements against the TeX
    source, the redone proofs, and every recorded departure, and then checked the rewritten
    documents against the code, the audit output, the TeX source and the cited works. In the round
    that redid the cited results by their sources' proofs, agents compared these results with the
    sources, independent reviewers checked the redone proofs of the packages against the sources, the
    statements of Morrey/Common/External, the restated Proposition 2.7 (6) and the updated
    documents.

alignment:
  namespace: "CasseseChallenge"
  statements:
    - source: "Theorem 1.2"
      lean: "CasseseChallenge.theorem1_2"
      module: "Cassese.Challenge"
      status: "proved"
      note: "Every p > 1: a p-homogeneous, rank-one convex, nowhere quasiconvex integrand on R^{2 x m} for m >= m0(p); proved by the paper's route (Section 4.4), and by the route of Remark 4.5 as Cassese.theorem1_2_elementary."
    - source: "Theorem 1.3, first assertion"
      lean: "CasseseChallenge.theorem1_3_a"
      module: "Cassese.Challenge"
      status: "proved"
      note: "A homogeneous quartic polynomial on R^{2 x 3}, rank-one convex and nowhere quasiconvex."
