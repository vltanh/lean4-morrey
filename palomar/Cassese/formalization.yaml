# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Cassese 2026: Morrey's problem in R^{2 x m}, in Lean"
  description: >-
    Complete and unconditional. A Lean 4 formalization of G. Cassese, "A solution to Morrey's
    problem in R^{2 x m}" (arXiv:2608.03488v3, 2026): rank-one convex integrands on 2 x m
    matrices, m >= 3, that are nowhere quasiconvex, so that with Šverák's theorem only 2 x 2
    remains open; and p-homogeneous examples answering Kirchheim and Kristensen's homogeneous
    problem negatively.


    Every result that the paper proves is proved, with no hypothesis beyond the paper's:
    Theorem 1.2 (every p > 1, 2 x m for m large, by the paper's UMD route, and a second time by
    its elementary route), Theorem 1.3 (a quartic on 2 x 3, and p near 4), Corollary 5.3 (its
    transpose on 3 x 2), the consequences that only 2 x 2 remains, Theorem 1.4 (d x d, every
    p, and p = 4 for d >= 588), Theorem 1.5 (4 x 2, every p != 2) and Corollary 1.6. The results
    of other works that the proofs use are proved too, in their sources' terms: Burkholder's
    inequalities and functions, UMD theory for L^p and the Schatten classes, decoupling, the
    Kahane-Khintchine and non-commutative Khintchine inequalities, transference for homogeneous
    multipliers, Dragičević's lower bound for the square of the Beurling-Ahlfors transform,
    Dacorogna's formula for the quasiconvex envelope, Kristensen's smoothing and the textbook facts
    of the calculus of variations, by the arguments of their sources except for the upper bound of
    the non-commutative Khintchine inequality. They come from three Lake packages written for this project
    (lean4-harmonic-analysis, lean4-banach-probability, lean4-calculus-of-variations). The paper
    is one of three on Morrey's problem formalized in this repository, each its own submission.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

classification:
  arxiv: ["math.AP", "math.FA", "math.PR"]
  msc2020: ["49J45", "26B25", "60G42", "46B09", "42B15", "46L53", "68V15"]

sources:
  - title: "A solution to Morrey's problem in R^{2 x m}"
    authors:
      - "Gabriele Cassese"
    id: "arXiv:2608.03488v3"
    type: "preprint"
    location: "https://arxiv.org/abs/2608.03488v3"
    relationship: "formalizes"
    note: >-
      Formalized against the TeX source of v3 (16 September 2026). Every numbered result that the
      paper proves is proved, unconditionally (Theorem 1.1 and Proposition 2.6, quoted as context,
      are stated and not proved); Theorem 1.2 by the paper's route (Section 4.4), and its route of
      Remark 4.5 as a second theorem. See status.scope.
    author_endorsement: "not-contacted"
  - title: "Rank-one convexity does not imply quasiconvexity"
    authors:
      - "Vladimír Šverák"
    id: "Proc. Roy. Soc. Edinburgh Sect. A 120 (1992), 185-189"
    type: "article"
    relationship: "background"
    note: "Used by the consequences after Theorem 1.3; formalized in this repository (palomar/Sverak) and imported."
  - title: "Sharp martingale and semimartingale inequalities"
    authors:
      - "Adam Osękowski"
    id: "Monografie Matematyczne 72, Birkhäuser (2012)"
    type: "book"
    relationship: "background"
    note: >-
      Read and followed. Theorems 3.5 and 8.6 (the paper's Theorem 2.3, Burkholder's inequality and
      the square function inequality), and the sharpness of p* - 1 for dyadic martingales (Theorem
      3.5, with Remark 3.8 and p. 138), which the paper's Corollary 6.3 uses: proved in
      lean4-banach-probability by the book's proofs (integration method; second approach and
      duality), with their slips repaired (Morrey/Common/External/Osekowski). Theorem 3.24 (the
      paper's Proposition 2.6) is stated for context, not proved, and used by no proof.
  - title: "Sharp inequalities for martingales and stochastic integrals"
    authors:
      - "Donald L. Burkholder"
    id: "Astérisque 157-158 (1988), 75-94"
    type: "article"
    location: "https://www.numdam.org/item/AST_1988__157-158__75_0/"
    relationship: "background"
    note: >-
      Read (Numdam) and followed for Burkholder's function, (1.10) and Remark 1.2 (the paper's (13),
      (14)), proved in lean4-banach-probability (Morrey/Common/External/Burkholder). Remark 1.2, stated
      without proof, is completed from (1.14) and the shift of the proof of (1.8) (see fidelity).
  - title: "Martingales, laminates and minimal Korn inequalities"
    authors:
      - "Gabriele Cassese"
    id: "arXiv:2512.02784; J. Math. Pures Appl. 213 (2026)"
    type: "article"
    location: "https://arxiv.org/abs/2512.02784"
    relationship: "background"
    note: >-
      Read. Cited for the sharpness of p* - 1 (its Theorem 2.3 quotes it from Burkholder, Ann. Probab.
      12 (1984), and Osękowski 2012) and for Proposition 7.1 (its Theorem 2.1). Burkholder (1984) was
      read and is not followed.
  - title: "Analysis in Banach Spaces, Volumes I and II"
    authors:
      - "Tuomas Hytönen"
      - "Jan van Neerven"
      - "Mark Veraar"
      - "Lutz Weis"
    id: "Springer (2016, 2017)"
    type: "book"
    relationship: "background"
    note: >-
      Read and followed. Volume I: Theorems 4.2.5 (by the book's alternative proof, p. 334), 4.2.7 and
      4.5.6, Proposition 4.2.3 (with Cox-Veraar), Proposition 4.2.10 and Theorem 4.2.25 (for
      Yaroslavtsev's Lemma 3.2) and Corollary 5.7.6; Volume II: Theorem 6.2.4, with its constants. Proved in
      lean4-banach-probability and lean4-harmonic-analysis by the books' proofs, with their slips
      repaired, for the paper's UMD constants (predictable signs, its Definition 2.5), real spaces and
      probability spaces (Morrey/Common/External/HNVW).
  - title: "Non-commutative martingale transforms"
    authors:
      - "Narcisse Randrianantoanina"
    id: "J. Funct. Anal. 194 (2002), 181-212; arXiv:math/0111264"
    type: "article"
    location: "https://arxiv.org/abs/math/0111264"
    relationship: "background"
    note: "Read (Sections 2-4). Corollary 4.5 and Remark 4.6 (1), proved in lean4-banach-probability by the source's route (Morrey/Common/External/Randrianantoanina)."
  - title: "Martingales in Banach spaces"
    authors:
      - "Gilles Pisier"
    id: "Cambridge Studies in Advanced Mathematics 155 (2016)"
    type: "book"
    relationship: "background"
    note: "Corollary 5.22 (L^p is UMD), read in the 2011 IHP lecture notes (Corollary 8.19); proved by its Fubini argument, applied to Paley-Walsh martingales, and HNVW I, Theorem 4.2.5 (Morrey/Common/External/Pisier). The book was not obtained."
  - title: "Some remarks on tangent martingale difference sequences in L^1-spaces"
    authors:
      - "Sonja Cox"
      - "Mark Veraar"
    id: "Electron. Commun. Probab. 12 (2007), 421-433"
    type: "article"
    relationship: "background"
    note: "Introduction read; it recalls decoupling (the paper's Proposition 2.8) without proof. Proved by HNVW I, Proposition 4.2.3, for Paley-Walsh martingales (Morrey/Common/External/CoxVeraar)."
  - title: "Even Fourier multipliers and martingale transforms in infinite dimensions"
    authors:
      - "Ivan Yaroslavtsev"
    id: "Indag. Math. 29 (2018), 1290-1309"
    type: "article"
    relationship: "background"
    note: "Section 3 read. Lemma 3.2 (no proof there: HNVW I, Proposition 4.2.10) and Proposition 3.7 (complex UMD constants, for the closed unit disc), proved in lean4-banach-probability by HNVW's proofs (Morrey/Common/External/Yaroslavtsev)."
  - title: "Non-commutative L^p-spaces (Handbook of the Geometry of Banach Spaces 2)"
    authors:
      - "Gilles Pisier"
      - "Quanhua Xu"
    id: "North-Holland (2003), 1459-1517"
    type: "book chapter"
    relationship: "background"
    note: >-
      Read. Theorem 6.1 (the non-commutative Khintchine inequality, the paper's Proposition 6.3) has no
      proof there; the chapter refers to Lust-Piquard (1986), not obtained, and to Lust-Piquard and
      Pisier (1991). The lower bound is proved as there; the upper bound, at present, by the method
      of Mackey, Jordan, Chen, Farrell and Tropp, Ann. Probab. 42 (2014), a departure (see fidelity)
      (Morrey/Common/External/PisierXu).
  - title: "Non commutative Khintchine and Paley inequalities"
    authors:
      - "Françoise Lust-Piquard"
      - "Gilles Pisier"
    id: "Ark. Mat. 29 (1991), 241-260"
    type: "article"
    relationship: "background"
    note: "Read. The lower bound of the non-commutative Khintchine inequality follows (I.5)-(I.7); its upper bound (Theorem III.1, Corollary III.4) is not followed at present."
  - title: "Matrix triangle inequalities: past, present, and future"
    authors:
      - "Jean-Christophe Bourin"
      - "Teng Zhang"
    id: "arXiv:2610.30538"
    type: "preprint"
    location: "https://arxiv.org/abs/2610.30538"
    relationship: "background"
    note: >-
      Proposition 3.13, by the third proof of Remark 3.14 (Hermitian dilations and the convexity
      inequality (1.1), proved by Peierls's argument; q = infinity by Weyl's inequality): the
      argument for the triangle inequality of Schatten norms, a standard fact that the paper uses
      without a source (Bhatia, Matrix Analysis, Theorem IV.2.1, proves it by majorization). Proved in
      lean4-banach-probability for real m x n matrices; the source treats complex square matrices,
      by the same argument.
  - title: "Matrix Analysis"
    authors:
      - "Rajendra Bhatia"
    id: "Graduate Texts in Mathematics 169, Springer (1997)"
    type: "book"
    relationship: "background"
    note: "Read (Chapters III, IV, in part). The paper's facts (1)-(3) on Schatten norms (Section 1.5), proved in Cassese's library by its arguments."
  - title: "Some remarks on the L^p estimates for powers of the Ahlfors-Beurling operator"
    authors:
      - "Oliver Dragičević"
    id: "Arch. Math. 96 (2011), 463-471"
    type: "article"
    relationship: "background"
    note: >-
      Read and followed. Theorem 1.1 (for p > 2) at n = 2, proved in lean4-harmonic-analysis with the
      article's test functions (Morrey/Common/External/Dragicevic); its sentence on W^{n,p}, stated
      without proof, is replaced by what is used of it, by a density argument.
  - title: "Sharp L^p estimates of powers of the complex Riesz transform"
    authors:
      - "Andrea Carbonaro"
      - "Oliver Dragičević"
      - "Vjekoslav Kovač"
    id: "Math. Ann. 386 (2023), 1081-1125; arXiv:2109.08369"
    type: "article"
    location: "https://arxiv.org/abs/2109.08369"
    relationship: "background"
    note: "Read. Section 1.3.1 (the norms of the powers of the Beurling-Ahlfors transform on L^p and on the dual space agree) gives p < 2 in the paper's Theorem 7.1."
  - title: "Calculus of Variations"
    authors:
      - "Filip Rindler"
    id: "Universitext, Springer (2018); 2nd ed., Graduate Texts in Mathematics 310 (2026)"
    type: "book"
    relationship: "background"
    note: >-
      The first edition, which the paper cites (Lemma 5.6, Propositions 5.1, 5.3), was not obtained; the
      second one was read, and Lemma 5.9 (the paper's Lemma 2.1), Proposition 5.6 and Lemma 5.2 (i)
      (Lemma 2.2) are followed in lean4-calculus-of-variations (Morrey/Common/External/Rindler).
  - title: "Characterizations of Young measures generated by gradients"
    authors:
      - "David Kinderlehrer"
      - "Pablo Pedregal"
    id: "Arch. Rational Mech. Anal. 115 (1991), 329-365"
    type: "article"
    relationship: "background"
    note: "Read and followed. Proposition 8.1, with Step 6 of Proposition 7.2 (Dacorogna's formula, the paper's Proposition 2.2), proved in lean4-calculus-of-variations (Morrey/Common/External/KinderlehrerPedregal)."
  - title: "Direct Methods in the Calculus of Variations"
    authors:
      - "Bernard Dacorogna"
    id: "Applied Mathematical Sciences 78, Springer, 2nd ed. (2008)"
    type: "book"
    relationship: "background"
    note: >-
      Read and followed. Propositions 5.11 and 5.13 (Lemma 2.2), Theorem 5.20 with Lemma 5.24 repaired,
      Theorem 8.35 (ii) and Theorem 5.25 (i) (Proposition 5.1), proved in lean4-calculus-of-variations
      (Morrey/Common/External/Rindler, Morrey/Common/External/Dacorogna). Theorem 6.10, cited for
      Proposition 2.1, is not used: the paper's second route is.
  - title: "On the non-locality of quasiconvexity"
    authors:
      - "Jan Kristensen"
    id: "Ann. Inst. H. Poincaré Anal. Non Linéaire 16 (1999), 1-13"
    type: "article"
    location: "https://www.numdam.org/item/AIHPC_1999__16_1_1_0/"
    relationship: "background"
    note: "Proposition 2's smoothing, used by Corollary 5.2; proved in lean4-calculus-of-variations by Kristensen's construction, with cut-offs in |X|^2 (see fidelity)."

