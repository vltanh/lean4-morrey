# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Šverák 1992: rank-one convexity does not imply quasiconvexity, in Lean"
  description: >-
    A Lean 4 formalization of V. Šverák, "Rank-one convexity does not imply quasiconvexity",
    Proc. Roy. Soc. Edinburgh Sect. A 120 (1992), 185-189: a quartic polynomial F on 3x2
    matrices that is rank-one convex but not quasiconvex, and its lift to m x n matrices for
    m >= 3 and n >= 2, which answers Morrey's problem negatively for maps with at least three
    components.


    Every result of the paper is proved by the paper's argument: Lemma 1 (quasiconvexity of a
    continuous function is tested by periodic maps), the structure of the subspace L and the
    computation (4), Lemma 2 (the extension of f from L to a rank-one convex F), the Theorem, the
    Remark (F is a polynomial of degree four) and the Corollary. Nothing is assumed, and the
    proofs use only Mathlib. The repository formalizes other papers on Morrey's problem too, each
    its own submission.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

classification:
  arxiv: ["math.AP", "math.OC"]
  msc2020: ["49J45", "26B25"]

sources:
  - title: "Rank-one convexity does not imply quasiconvexity"
    authors:
      - "Vladimír Šverák"
    id: "Proc. Roy. Soc. Edinburgh Sect. A 120 (1992), 185-189"
    type: "article"
    location: "https://doi.org/10.1017/S0308210500015080"
    relationship: "formalizes"
    note: >-
      Formalized from the published article (PDF). Every result is proved by the paper's
      argument; the formalization supplies the limit in Lemma 1, which the paper leaves to the
      reader, and builds the cut-off of Lemma 1 with the paper's bound |D eta| <= 2/eps.
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/sergioconti/so3-r1c-and-not-qc"
    relationship: "independent"
    note: >-
      Conti, Dolzmann and Dondl's Lean 4 formalization of a frame-indifferent rank-one convex,
      non-quasiconvex function on 3x3 matrices, with its own definitions. It includes adaptations
      to R^3 of parts of Šverák's argument (of the test map w, as phi(x) = (sin x1, sin x2,
      -sin(x1 + x2)), of its gradients in L and of the integral (4)) and the "only if" half of
      Lemma 1; not Lemma 2, the Theorem or the Corollary. The proofs here were written without
      consulting it; searches and checks of 21-22 November 2026 displayed parts of it
      (docs/Cassese/CREDITS.md), and nothing from it was used.
  - id: "https://github.com/Gabriele-Cassese/MorreyTwoComponentsLean"
    relationship: "independent"
    note: >-
      Cassese's Lean formalization of results of arXiv:2608.03488 (2x m and 2x3 examples); not a
      formalization of this paper. The proofs here were written without consulting it; searches and
      checks of 21-22 November 2026 displayed parts of it (docs/Cassese/CREDITS.md), and nothing from
      it was used.
  - id: "palomar/Pedregal in this repository"
    relationship: "other"
    note: >-
      The audit of Pedregal, arXiv:1905.06571v5 (a claimed proof for 2x2), in the same
      repository, with its own Challenge and metadata.
  - id: "palomar/Cassese in this repository"
    relationship: "other"
    note: >-
      The formalization of Cassese, arXiv:2608.03488v3, in the same repository, with its own
      Challenge and metadata (every result that the paper proves is proved, unconditionally). It
      imports this library: it restates Šverák's example in Cassese's definitions, and its
      periodic test maps use the cut-off of Lemma 1.

status:
  scope: >-
    The whole paper: Lemma 1, the rank-one directions of L and the affinity of f on rank-one lines
    in L, Dw and (4), Lemma 2 with (6)-(8) and the compactness argument, (10)-(11), the Theorem,
    the Remark and the Corollary. Not formalized: the introduction's survey of known results.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code 2.1.330 (VS Code extension, Claude Agent SDK)"
      tool_setup: >-
        The formalize-math-paper skill (https://github.com/vltanh/formalize-math-paper, commit
        020f253); the main session and 7 sub-agents on this paper (1 statement checker, 4 provers,
        1 proof checker, 1 cleanup agent), plus 1 checker of the repository's README shared with
        the other papers; Lean v4.36.0-rc2, Mathlib v4.36.0-rc2. A later round (21-22 November
        2026, the skill's version 4.2.0, commit f5e7420): an independent audit of every recorded
        departure, 2 provers that rebuilt the cut-off of Lemma 1 as the paper's and the
        mollification lemmas it uses, and an independent reviewer of that work.
      cost:
        wall_time: "1.7 h elapsed for the whole second round (this paper, Cassese's and the reorganization, in parallel); 1.4 h of sub-agent working time on this paper; in the later round, 0.26 h of prover time on this paper, besides agents shared with Cassese's paper"
        spend_usd: "not tracked"
        hardware: "local machine (20 cores, 62 GB RAM) and API"
      prompting_notes: >-
        The user supplied the paper's PDF and asked for it to be formalized in the repository
        that already held the audit of Pedregal's paper, independently of other formalizations.
  spend_usd: "not tracked"
  notes: >-
    The AI system wrote the code and the documents at the request of the author. No person has
    reviewed the proofs. Independent AI agents checked the statements against the paper, the
    formal proofs against the paper's, every recorded departure, and the documents. See
    docs/Sverak/CREDITS.md.

fidelity:
  divergences: >-
    Statements: no statement of the paper was changed. Readings: matrices are Matrix (Fin m) (Fin n)
    R and gradients have the components as rows; quasiconvexity (ii) is stated on a given domain,
    with smooth compactly supported test maps and the requirement that the integral exist (automatic
    for continuous f on a bounded domain), and the Theorem and the Corollary are proved on the open
    unit cube, the domain of the paper's proofs (the paper cites that the class does not depend on
    the domain; that is not formalized for smooth test maps); Lemma 1 is proved for every matrix A
    (the paper writes A = 0); P is given by its formula and proved orthogonal; the constants that
    the paper leaves open are c = 6 in Lemma 2 and k = n + 1 for some natural n; the cut-off of
    Lemma 1, which the paper takes for granted, is built with the paper's properties (1 on [eps, 1 -
    eps]^n, 0 off (eps/16, 1 - eps/16)^n, |D eta| <= 8/(5 eps) <= 2/eps) as the mollification of a
    Lipschitz profile; "polynomial of degree four" is total degree 4, for eps /= 0. Proofs: every
    proof follows the paper's argument, with no departure; the steps it leaves to the reader (the
    limit in Lemma 1, the compactness of K and the other implicit steps of Lemma 2, the rank-zero
    case in the Corollary) are supplied along its lines. See docs/Sverak/REPORT.md, Sections 3, 6
    and 7.

review:
  status: "agent-reviewed"
  reviewers:
    - "a Claude Opus 5.5 sub-agent (second round): the statements against the paper"
    - "a Claude Opus 5.5 sub-agent (second round): the formal proofs against the paper's"
    - "a Claude Opus 5.5 sub-agent (second round): the literature in the repository's README"
    - "a Claude Opus 5.5 sub-agent (third round): every recorded departure, read-only"
    - "a Claude Opus 5.5 sub-agent (third round): the rebuilt cut-off of Lemma 1 against the paper"
    - "a Claude Opus 5.5 sub-agent (third round): the rewritten documents against the code and the paper"
  notes: >-
    No human review. Independent AI agents (Claude Opus 5.5) checked every statement against the
    paper, compared the formal proofs with the paper's, audited every recorded departure against
    the paper, and checked the documents against the code and the paper.

alignment:
  namespace: "SverakChallenge"
  statements:
    - source: "Theorem"
      lean: "SverakChallenge.theorem_main"
      module: "Sverak.Challenge"
      status: "proved"
      note: "There are eps > 0 and k > 0 such that F = sverakF eps k is rank-one convex and not quasiconvex (on the unit cube)."
    - source: "Corollary"
      lean: "SverakChallenge.corollary"
      module: "Sverak.Challenge"
      status: "proved"
      note: "With the same eps and k, F(TX) is rank-one convex and not quasiconvex on m x n matrices, for every m >= 3 and n >= 2."
    - source: "Remark"
      lean: "SverakChallenge.remark_polynomial"
      module: "Sverak.Challenge"
      status: "proved"
      note: "For eps /= 0, F is a polynomial of total degree four in the entries."

acknowledgements: >-
  Mathlib; Lean's Comparator, NanoDa and con-ron kernels; Palomar's validation scripts.
